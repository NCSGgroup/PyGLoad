[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PyGWater"
version = "0.9.0"
description = "Elastic loading deformation (GNSS, geoid, gravity) from surface water loads: forward modelling and inversion with a choice of basis functions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fan Yang" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "h5py>=3.8", "netCDF4>=1.6", "threadpoolctl>=3"]

[project.optional-dependencies]
mesh = ["geopandas>=0.13", "shapely>=2.0"]
test = ["pytest>=7"]
figures = ["pygmt"]

[project.urls]
Repository = "https://github.com/NCSGgroup/PyGWater"

# The released package is the whole public repository: the core code (src/) is imported as `PyGWater`; the published
# studies, examples, tests, documentation and installation files ship inside it as PyGWater.studies, PyGWater.examples,
# PyGWater.tests, PyGWater.doc and PyGWater.installation, without moving any folder. Personal files and the local-only
# studies (JGR2025_basis_functions, GNSS_TWS_validation) are not published (see .gitignore).
# Details: doc/installation.md, "What the installed package contains".
[tool.setuptools]
package-dir = { "PyGWater" = "src", "PyGWater.studies" = "studies", "PyGWater.examples" = "examples", "PyGWater.tests" = "tests", "PyGWater.doc" = "doc", "PyGWater.installation" = "installation" }
packages = ["PyGWater", "PyGWater.utils", "PyGWater.earth", "PyGWater.basis", "PyGWater.basis.spherical_harmonic",
            "PyGWater.basis.green", "PyGWater.forward", "PyGWater.inversion", "PyGWater.observations", "PyGWater.preprocessing", "PyGWater.mesh",
            "PyGWater.studies", "PyGWater.studies.China", "PyGWater.studies.Fu2015_PNW", "PyGWater.studies.GNSS_GRACE",
            "PyGWater.examples", "PyGWater.tests", "PyGWater.doc", "PyGWater.installation"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.txt", "*.csv"]
"PyGWater.installation" = ["environment.yml", "requirements.txt", "pygwater_paths.cfg.example"]

# personal and local files are never released (they are also git-ignored)
[tool.setuptools.exclude-package-data]
"PyGWater.doc" = ["cowork_sync.md"]
"PyGWater.installation" = ["pygwater_paths.cfg", "PyGWater.egg-info/*", "build/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# install metadata (PyGWater.egg-info) and build files go to installation/, not the top level
[tool.distutils.egg_info]
egg_base = "installation"

[tool.distutils.build]
build_base = "installation/build"
